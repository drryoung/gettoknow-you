seoTitle: Meet
seoDescription: >-
  The emerging GetToKnow.You community, future gatherings, and the shared
  Community Charter.
eyebrow: Community
heading: Meet
lede: >-
  GetToKnow.You exists so people can encounter and know one another more deeply.
  The community is emerging—there is no registration form here, and no claim of
  live events or member rooms until they truly exist.
intentHeading: What this may become
intentText: >-
  Over time, Meet may hold conversations, workshops, and community experiments.
  Until then, this page is an honest place to understand the intention and the
  shared foundation.
charterCtaLabel: Read the Community Charter
emptyMessage: Community foundations will appear here as they are added to the commons.
